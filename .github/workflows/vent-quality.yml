name: VENT launch checks
on:
  push:
    branches: [vent-launch-source]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/run-tests.mjs
      - run: npm run build
      - run: node scripts/test-build-surface.mjs
