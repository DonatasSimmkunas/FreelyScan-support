name: Telkinys V15 validation
on:
  push:
    branches: [telkinys-v15-work]
    paths: ['telkinys-v14/**', 'telkinys-v15/**', '.github/workflows/telkinys-v15.yml']
permissions:
  contents: write
concurrency:
  group: telkinys-v15-work-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the isolated V15 work branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate modules, template and CSP; build candidate
        run: node telkinys-v15/build.mjs --write-deployment-artifact
      - name: Upload review source and built preview
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telkinys-v15-review
          path: |
            telkinys-v14/
            telkinys-v15/
            dist/
          retention-days: 7
      - name: Save generated HTML only to the isolated V15 work branch
        if: success() && github.ref == 'refs/heads/telkinys-v15-work'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- telkinys-deploy/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Build validated V15 candidate [skip ci]'
            git push origin HEAD:telkinys-v15-work
          fi
