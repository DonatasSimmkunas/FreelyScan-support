<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Galutinis pasiūlymas — VENT IT</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f9fb;color:#10283a;font:16px/1.6 system-ui}main{max-width:900px;margin:30px auto;padding:24px;background:white;border-radius:20px}h1{line-height:1.2}table{width:100%;border-collapse:collapse}td,th{padding:12px 6px;text-align:left;border-bottom:1px solid #ddd}button{padding:14px 20px;border:0;border-radius:12px;background:#0baec0;color:white;font-weight:700;cursor:pointer}.note{background:#edf8fb;padding:16px;border-radius:12px}.total{font-size:24px;font-weight:800}input{margin-right:10px}#result{white-space:pre-line}@media(max-width:600px){main{margin:8px;padding:16px;font-size:14px}table{font-size:12px}td,th{padding:9px 3px}}@media print{.actions{display:none}body{background:white}main{margin:0}}</style></head><body><main><a href="index.html">VENT IT</a><h1 id="heading">Galutinis pasiūlymas / Final quotation</h1><div id="content">Tikrinamas pasiūlymas…</div><p id="result" role="status" aria-live="polite"></p></main><script>
const q=new URLSearchParams(location.search),api='https://fihyzcabvrndsztlsufg.supabase.co/functions/v1/quote-access',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>new Intl.NumberFormat('lt-LT',{style:'currency',currency:'EUR'}).format(Number(v));let quote;
async function load(){try{const r=await fetch(api,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({order:q.get('order'),token:q.get('token')})});const d=await r.json();if(!r.ok)throw Error(d.error==='quote_expired'?'Pasiūlymo galiojimas baigėsi / Quote expired.':'Pasiūlymas nepasiekiamas / Quote unavailable.');quote=d;const a=d.recipient,s=d.seller;document.getElementById('content').innerHTML=`<p><b>${esc(s.legal_name)}</b> · ${esc(s.company_code)} · ${esc(s.vat_id)}<br>${esc(s.registered_address)}<br>${esc(s.phone)} · ${esc(s.sales_email)}</p><h2>${esc(d.order_no)}</h2><p>Gavėjas / Recipient: ${esc(a.name)}<br>${esc(a.street)}, ${esc(a.postal_code)} ${esc(a.city)}<br>${esc(a.phone)}</p><table><tr><th>Prekė / Item</th><th>Kiekis / Qty</th><th>Kaina / Price</th><th>Suma / Total</th></tr>${d.items.map(i=>`<tr><td>${esc(i.model)}<br><small>${esc(i.sku)}</small></td><td>${esc(i.qty)}</td><td>${money(i.unit_price_eur)}</td><td>${money(i.line_total_eur)}</td></tr>`).join('')}</table><p>Prekės / Goods: ${money(d.subtotal_eur)}<br>Pristatymas / Delivery: ${money(d.shipping_eur)}</p><p class="total">Iš viso / Total: ${money(d.total_eur)}</p><div class="note"><p>Mokesčiai / Tax: ${esc(d.quote.tax_note)}</p><p>Pristatymo terminas / Delivery term: ${esc(d.quote.lead_time)}</p><p>Grąžinimo išlaidos / Return cost: ${esc(d.quote.return_cost_estimate)}</p><p>Garantija / Warranty: ${esc(d.quote.warranty_note)}</p><p>Galioja iki / Valid until: ${esc(new Date(d.quote.expires_at).toLocaleString())}</p></div><div class="actions"><p><a href="terms.html" target="_blank" rel="noopener">Pirkimo sąlygos / Terms</a> · <a href="returns.html" target="_blank" rel="noopener">Grąžinimas / Returns</a> · <a href="privacy.html" target="_blank" rel="noopener">Privatumas / Privacy</a></p><label><input id="acceptTerms" type="checkbox">Patvirtinu galutines kainas, pristatymą ir pirkimo sąlygas. Pasiūlymo priėmimas įpareigoja sumokėti. / I accept the final prices, delivery and terms. Acceptance creates an obligation to pay.</label><p><button id="acceptQuote" ${d.accepted||d.status!=='request_received'?'disabled':''}>${d.accepted?'Pasiūlymas patvirtintas / Accepted':'Patvirtinti pasiūlymą / Accept & order'}</button> <button onclick="window.print()">Spausdinti / PDF</button></p><p>Šis puslapis nepatvirtina apmokėjimo. Apmokėjimo instrukciją pateiksime atskirai. / This page is not proof of payment. Payment instructions will follow separately.</p></div>`;document.getElementById('acceptQuote').onclick=accept;}catch(e){document.getElementById('content').textContent=e.message}}
async function accept(){if(!document.getElementById('acceptTerms').checked){document.getElementById('result').textContent='Pažymėk sutikimą su pasiūlymu / Accept the terms first.';return}const btn=document.getElementById('acceptQuote');btn.disabled=true;try{const r=await fetch(api,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({order:q.get('order'),token:q.get('token'),action:'accept',version:quote.quote.version,accept_terms:true})});if(!r.ok)throw Error();document.getElementById('result').textContent='Pasiūlymas patvirtintas. Mokėjimas dar neatliktas. / Quotation accepted. Payment has not been made.';btn.textContent='Patvirtinta / Accepted'}catch{btn.disabled=false;document.getElementById('result').textContent='Nepavyko patvirtinti. Atnaujink puslapį / Unable to accept. Reload the page.'}}
load();
</script></body></html>
