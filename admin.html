<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>VENT IT Admin</title><style>
:root{--n:#08263b;--c:#11b6c9;--ink:#10283a;--muted:#6b7f8c;--line:#dfe8ee;--soft:#f6fafb}*{box-sizing:border-box}body{margin:0;font:16px/1.6 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#fff}header{border-bottom:1px solid var(--line);position:sticky;top:0;background:#fffffff2;backdrop-filter:blur(12px);z-index:5}.nav{max-width:1120px;margin:auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:900;font-size:22px;color:var(--n)}.brand span{color:var(--c)}nav a{margin-left:16px;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}main{max-width:960px;margin:auto;padding:46px 20px 70px}h1,h2,h3{line-height:1.2;color:var(--n)}h1{font-size:42px;letter-spacing:-.04em}h2{margin-top:38px;font-size:24px}p,li{color:#425c6d}.note{background:#eef9fb;border:1px solid #cdebf0;padding:14px 16px;border-radius:14px}.warn{background:#fff8e9;border:1px solid #f0dba5;padding:14px 16px;border-radius:14px}footer{border-top:1px solid var(--line);padding:25px 20px;color:var(--muted);text-align:center;font-size:12px}.btn{display:inline-block;background:var(--c);color:#fff!important;text-decoration:none;padding:11px 16px;border-radius:999px;font-weight:800}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left}@media(max-width:700px){h1{font-size:34px}.nav{align-items:flex-start}.nav nav{display:none}}
</style></head><body><header><div class="nav"><a class="brand" href="index.html">VENT <span>IT</span></a><nav><a href="index.html#shop">Shop</a><a href="planner.html">Planner</a><a href="shipping.html">Shipping</a><a href="returns.html">Returns</a><a href="terms.html">Terms</a></nav></div></header><main><h1>VENT IT Admin</h1><div id="login"><p>Sign in with your authorised VENT IT account.</p><input id="email" type="email" placeholder="Email" style="padding:12px;border:1px solid #dfe8ee;border-radius:10px;min-width:280px"><button class="btn" id="sign">Send sign-in link</button></div><div id="denied" hidden class="warn">Signed in, but this account is not yet in the <code>site_admins</code> allowlist.</div><div id="dash" hidden><h2>Orders</h2><div id="orders"></div><h2>Product override</h2><div class="note"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input id="ovSku" placeholder="SKU"><input id="ovPrice" type="number" step="0.01" placeholder="Store price override"><input id="ovLead" placeholder="Lead time text"><select id="ovStock"><option value="">Stock status (unchanged)</option><option value="in_stock">In stock</option><option value="lead_time">Lead time</option><option value="made_to_order">Made to order</option><option value="quote">Quote</option></select><input id="ovImage" placeholder="Image override URL"><label><input id="ovHidden" type="checkbox"> Hide product</label></div><p><button class="btn" id="saveOverride">Save override</button></p><div id="ovState"></div></div><h2>7-day events</h2><div id="events"></div><h2>Image QA queue</h2><div id="reviews"></div></div></main><footer>© 2026 VENT IT · sales@vent.it.com · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://fihyzcabvrndsztlsufg.supabase.co','sb_publishable_HtD7m9xbEc00YJbytJRrRA_UhtG-DJe');const API='https://fihyzcabvrndsztlsufg.supabase.co/functions/v1/admin-data',UPD='https://fihyzcabvrndsztlsufg.supabase.co/functions/v1/admin-update';
sign.onclick=async()=>{await sb.auth.signInWithOtp({email:email.value,options:{emailRedirectTo:location.href}});alert('Check your email')};
async function run(){const {data}=await sb.auth.getSession();const tok=data.session?.access_token;if(!tok)return;window.__ADMIN_TOKEN=tok;login.hidden=true;const r=await fetch(API,{headers:{authorization:'Bearer '+tok}});if(r.status===403){denied.hidden=false;return}if(!r.ok)return;const d=await r.json();dash.hidden=false;orders.innerHTML='<table><tr><th>Order</th><th>Email</th><th>Total</th><th>Status</th><th>Confirmed quote payment</th></tr>'+d.orders.map(o=>'<tr><td>'+o.order_no+'</td><td>'+o.email+'</td><td>€'+o.total_eur+'</td><td>'+o.status+'</td><td>'+(o.status==='request_received'?'<button class="btn paymentQuote" data-order-id="'+o.id+'">Create card payment link</button>':'—')+'</td></tr>').join('')+'</table>';orders.querySelectorAll('.paymentQuote').forEach(btn=>btn.onclick=()=>confirmPaymentQuote(btn.dataset.orderId,btn));events.innerHTML=Object.entries(d.event_counts).map(([k,v])=>'<span style="display:inline-block;margin:5px;padding:7px 10px;background:#edf5f8;border-radius:999px">'+k+': '+v+'</span>').join('');reviews.innerHTML='<p>'+d.image_reviews.length+' open image reviews.</p>'}run();
async function confirmPaymentQuote(orderId,button){
 const shipping=prompt('Confirmed freight in EUR (not an estimate):');if(shipping===null||shipping.trim()===''||!Number.isFinite(Number(shipping))||Number(shipping)<0)return;
 const tax=prompt('Confirmed VAT/tax treatment for these stored item prices:');if(!tax?.trim())return;
 const lead=prompt('Supplier-confirmed availability and delivery term:');if(!lead?.trim())return;
 if(!confirm('Confirm all item prices, VAT treatment, stock and delivery. Create a Stripe card payment link for this final quote?'))return;
 button.disabled=true;
 try{const r=await fetch('https://fihyzcabvrndsztlsufg.supabase.co/functions/v1/create-stripe-checkout',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+window.__ADMIN_TOKEN},body:JSON.stringify({order_id:orderId,confirm_quote:true,shipping_eur:Number(shipping),tax_note:tax,lead_time:lead})});const d=await r.json();if(!r.ok||!d.url)throw Error(d.error||'Payment unavailable');const a=document.createElement('a');a.href=d.url;a.textContent='Open confirmed quote payment';a.target='_blank';a.rel='noopener';button.replaceWith(a)}catch(e){alert(e.message);button.disabled=false}
}
saveOverride.onclick=async()=>{if(!window.__ADMIN_TOKEN)return;ovState.textContent='Saving…';const body={action:'product_override',sku:ovSku.value.trim(),store_price_override:ovPrice.value||null,lead_time_text:ovLead.value||null,stock_status:ovStock.value||null,image_override_url:ovImage.value||null,is_hidden:ovHidden.checked};const r=await fetch(UPD,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+window.__ADMIN_TOKEN},body:JSON.stringify(body)});ovState.textContent=r.ok?'Saved. Catalog config will reflect this override.':'Save failed.'};</script></body></html>
