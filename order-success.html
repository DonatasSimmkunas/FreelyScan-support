<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Order received — VENT IT</title><style>body{margin:0;background:#f5f9fb;font-family:Inter,system-ui,sans-serif;color:#10283a;display:grid;min-height:100vh;place-items:center}.box{width:min(620px,calc(100vw - 30px));background:#fff;border:1px solid #dfe8ee;border-radius:24px;padding:34px;box-shadow:0 20px 60px #08263b12}h1{color:#08263b;font-size:36px;letter-spacing:-.04em}.ok{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#e8faf1;color:#16865a;font-size:28px}.btn{display:inline-block;background:#11b6c9;color:#fff;text-decoration:none;padding:12px 17px;border-radius:999px;font-weight:800;margin-top:12px}.muted{color:#6b7f8c}</style></head><body><div class="box"><div class="ok" id="statusIcon">…</div><h1 id="statusTitle">Checking payment…</h1><p id="statusText" role="status" aria-live="polite">Please wait while we verify the payment.</p><p id="order" class="muted"></p><a class="btn" href="index.html">Back to VENT IT</a></div><script>
(async()=>{
 const q=new URLSearchParams(location.search),lang=localStorage.getItem('ventit-lang')||'en';
 const copy={lt:{checking:'Tikrinamas apmokėjimas…',paid:'Apmokėjimas patvirtintas',paidText:'Mokėjimų teikėjas patvirtino apmokėjimą. Užsakymo vykdymo informaciją pateiksime atskirai.',pending:'Apmokėjimas dar nepatvirtintas',pendingText:'Mokėjimas laukia patvirtinimo. Šis puslapis dar nėra apmokėjimo įrodymas.',error:'Nepavyko patikrinti apmokėjimo',errorText:'Apmokėjimo būsena nepatvirtinta. Kreipkitės į sales@vent.it.com ir nurodykite užsakymo numerį.'},en:{checking:'Checking payment…',paid:'Payment confirmed',paidText:'The payment provider has confirmed your payment. Order fulfilment information will follow separately.',pending:'Payment not yet confirmed',pendingText:'Payment is awaiting confirmation. This page is not proof of payment.',error:'Unable to verify payment',errorText:'Payment status could not be confirmed. Contact sales@vent.it.com with your order number.'},no:{checking:'Kontrollerer betaling…',paid:'Betaling bekreftet',paidText:'Betalingsleverandøren har bekreftet betalingen. Informasjon om levering følger separat.',pending:'Betaling ikke bekreftet ennå',pendingText:'Betalingen venter på bekreftelse. Denne siden er ikke betalingsbevis.',error:'Kunne ikke bekrefte betaling',errorText:'Betalingsstatus er ukjent. Kontakt sales@vent.it.com med ordrenummeret.'}}[lang]||null;
 const c=copy||{checking:'Checking payment…',paid:'Payment confirmed',paidText:'The payment provider confirmed your payment.',pending:'Payment not yet confirmed',pendingText:'Payment is awaiting confirmation.',error:'Unable to verify payment',errorText:'Contact sales@vent.it.com with your order number.'};
 document.getElementById('statusTitle').textContent=c.checking;
 document.getElementById('order').textContent=q.get('order')?'Order: '+q.get('order'):'';
 const show=(state)=>{document.getElementById('statusTitle').textContent=c[state];document.getElementById('statusText').textContent=c[state+'Text'];document.getElementById('statusIcon').textContent=state==='paid'?'✓':'?'};
 const paysera=q.get('provider')==='paysera';
 if(!(paysera?q.get('status_token'):q.get('session_id'))||!q.get('order')){show('error');return}
 try{const r=await fetch('https://fihyzcabvrndsztlsufg.supabase.co/functions/v1/'+(paysera?'paysera-payment-status':'payment-status'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(paysera?{status_token:q.get('status_token'),order:q.get('order')}:{session_id:q.get('session_id'),order:q.get('order')})});const d=await r.json();if(!r.ok)throw Error();show(d.paid?'paid':'pending');if(d.test)document.getElementById('statusText').textContent={lt:'Testinis mokėjimas. Tikri pinigai negauti; užsakymas nevykdomas.',en:'Test payment. No real funds received; the order is not fulfilled.',no:'Testbetaling. Ingen reelle midler mottatt; ordren behandles ikke.'}[lang]||'Test payment. No real funds received.'}catch{show('error')}
})();
</script></body></html>
