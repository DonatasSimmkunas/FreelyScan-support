<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>VENT IT Admin</title><style>
:root{--n:#08263b;--c:#11b6c9;--ink:#10283a;--muted:#6b7f8c;--line:#dfe8ee;--soft:#f6fafb}*{box-sizing:border-box}body{margin:0;font:16px/1.6 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#fff}header{border-bottom:1px solid var(--line);position:sticky;top:0;background:#fffffff2;backdrop-filter:blur(12px);z-index:5}.nav{max-width:1120px;margin:auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:900;font-size:22px;color:var(--n)}.brand span{color:var(--c)}nav a{margin-left:16px;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}main{max-width:960px;margin:auto;padding:46px 20px 70px}h1,h2,h3{line-height:1.2;color:var(--n)}h1{font-size:42px;letter-spacing:-.04em}h2{margin-top:38px;font-size:24px}p,li{color:#425c6d}.note{background:#eef9fb;border:1px solid #cdebf0;padding:14px 16px;border-radius:14px}.warn{background:#fff8e9;border:1px solid #f0dba5;padding:14px 16px;border-radius:14px}footer{border-top:1px solid var(--line);padding:25px 20px;color:var(--muted);text-align:center;font-size:12px}.btn{display:inline-block;background:var(--c);color:#fff!important;text-decoration:none;padding:11px 16px;border-radius:999px;font-weight:800}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left}@media(max-width:700px){h1{font-size:34px}.nav{align-items:flex-start}.nav nav{display:none}}
</style></head><body><header><div class="nav"><a class="brand" href="index.html">VENT <span>IT</span></a><nav><a href="index.html#shop">Shop</a><a href="planner.html">Planner</a><a href="shipping.html">Shipping</a><a href="returns.html">Returns</a><a href="terms.html">Terms</a></nav></div></header><main><h1>VENT IT Admin</h1><div id="login"><p>Sign in with your authorised VENT IT account.</p><input id="email" type="email" placeholder="Email" style="padding:12px;border:1px solid #dfe8ee;border-radius:10px;min-width:280px"><button class="btn" id="sign">Send sign-in link</button></div><div id="denied" hidden class="warn">Signed in, but this account is not yet in the <code>site_admins</code> allowlist.</div><div id="dash" hidden><h2>Orders</h2><div id="orders"></div><h2>7-day events</h2><div id="events"></div><h2>Image QA queue</h2><div id="reviews"></div></div></main><footer>© 2026 VENT IT · sales@vent.it.com · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://fihyzcabvrndsztlsufg.supabase.co','sb_publishable_HtD7m9xbEc00YJbytJRrRA_UhtG-DJe');const API='https://fihyzcabvrndsztlsufg.supabase.co/functions/v1/admin-data';
sign.onclick=async()=>{await sb.auth.signInWithOtp({email:email.value,options:{emailRedirectTo:location.href}});alert('Check your email')};
async function run(){const {data}=await sb.auth.getSession();const tok=data.session?.access_token;if(!tok)return;login.hidden=true;const r=await fetch(API,{headers:{authorization:'Bearer '+tok}});if(r.status===403){denied.hidden=false;return}if(!r.ok)return;const d=await r.json();dash.hidden=false;orders.innerHTML='<table><tr><th>Order</th><th>Email</th><th>Total</th><th>Status</th></tr>'+d.orders.map(o=>'<tr><td>'+o.order_no+'</td><td>'+o.email+'</td><td>€'+o.total_eur+'</td><td>'+o.status+'</td></tr>').join('')+'</table>';events.innerHTML=Object.entries(d.event_counts).map(([k,v])=>'<span style="display:inline-block;margin:5px;padding:7px 10px;background:#edf5f8;border-radius:999px">'+k+': '+v+'</span>').join('');reviews.innerHTML='<p>'+d.image_reviews.length+' open image reviews.</p>'}run();
</script></body></html>
